services:
  - type: web
    name: ai-research-agent
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: streamlit run main.py --server.address 0.0.0.0 --server.port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
